[project]
name = "busline-backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "vitalii", email = "vitalii.lohoida@nixs.com"}
]

dependencies = [
    "fastapi[all]>=0.110.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
testcontainers = {extras = ["postgres"], version = "^4.3.0"}
moto = {extras = ["s3"], version = "^4.2.0"}
ruff = "^0.3.4"
pre-commit = "^3.7.0"


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   
    "W",   
    "F",   
    "I",   
    "B",   
    "C4",  
    "UP",  
    "T20", 
]

ignore = [
    "B008"
]

[tool.ruff.lint.isort]
known-local-folder = ["tests", "app", "scripts"]
split-on-trailing-comma = true
combine-as-imports = true
detect-same-package = true
force-sort-within-sections = true