[project]
name = "busline-backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [
    {name = "vitalii", email = "vitalii.lohoida@nixs.com"}
]

dependencies = [
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "fastapi[all]>=0.110.0",
    "psycopg[binary]>=3.2.9",
    "sqlalchemy[asyncio]>=2.0.29",
    "structlog>=24.1.0",
    "aioboto3>=15.5.0,<16.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28.1"
moto = {extras = ["s3", "server"], version = ">=5.1.20"}
polyfactory = ">=2.21.0"
pre-commit = ">=3.7.0"
pytest = ">=8.4.1"
pytest-asyncio = ">=1.0.0"
pytest-cov = ">=6.2.1"
ruff = ">=0.12.1"
testcontainers = {extras = ["postgres"], version = ">=4.10.0"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   
    "W",   
    "F",   
    "I",   
    "B",   
    "C4",  
    "UP",  
    "T20", 
]

ignore = [
    "B008"
]

[tool.ruff.lint.isort]
known-local-folder = ["tests", "app", "scripts"]
split-on-trailing-comma = true
combine-as-imports = true
detect-same-package = true
force-sort-within-sections = true