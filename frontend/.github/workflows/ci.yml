name: Busline CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-assurance:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: bunx prettier --check .

      - name: Write .env for Orval
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            umask 077
            printf "%s" "$ENV_FILE" > .env
          else
            echo "❌ ENV_FILE is empty. Failing the workflow."
            exit 1
          fi

      - name: Generate API Types
        run: bun --env-file=.env x orval

      - name: Type Check
        run: bun tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  deploy:
    environment: staging
    runs-on: ubuntu-latest
    needs: quality-assurance
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd ~/busline-frontend

            git pull origin main

            npm install
            npx --env-file=.env orval
            npm run build

            npm prune --production
            npm cache clean --force
            pm2 flush

            pm2 delete busline-frontend 2>/dev/null || true
            pm2 start npm --name "busline-frontend" -- start
            pm2 save
