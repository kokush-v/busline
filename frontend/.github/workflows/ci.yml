name: Busline CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-assurance:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: bunx prettier --check .

      - name: Write .env for Orval
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            umask 077
            printf "%s" "$ENV_FILE" > .env
          else
            echo "❌ ENV_FILE is empty. Failing the workflow."
            exit 1
          fi

      - name: Generate API Types
        run: bun --env-file=.env x orval

      - name: Type Check
        run: bun tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  deploy:
    runs-on: ubuntu-latest
    needs: quality-assurance
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and Build (Prepare Artifact)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf "%s" "$ENV_FILE" > .env.production
          bun install --frozen-lockfile
          bun run build
          # Видаляємо devDependencies, щоб папка була легшою
          rm -rf node_modules
          bun install --production

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".next,public,package.json,node_modules,.env.production,next.config.mjs"
          target: "~/busline-frontend"

      - name: Restart PM2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/busline-frontend

            pm2 flush
            sudo journalctl --vacuum-time=1d
            npm cache clean --force

            pm2 reload busline-frontend || pm2 start npm --name "busline-frontend" -- start
            pm2 save
